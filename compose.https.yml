services:
  caddy:
    image: caddy:2-alpine
    environment:
      MATCHPOINT_DOMAIN: ${MATCHPOINT_DOMAIN:?Please set MATCHPOINT_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
