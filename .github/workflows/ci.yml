name: Test application and container
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Test official data and deployment behavior
        run: npm test
      - name: Install browser for deterministic UI checks
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify reminders, PWA lifecycle and mobile text layout
        env:
          HOST: 127.0.0.1
          PORT: "4179"
          MATCHPOINT_DATA_DIR: ${{ runner.temp }}/matchpoint-browser-data
          MATCHPOINT_ARCHIVE_SYNC: "false"
          TEST_URL: http://127.0.0.1:4179
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          node server.mjs > "$RUNNER_TEMP/matchpoint-browser.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npm run smoke
          npm run test:ui
      - uses: docker/setup-buildx-action@v3
      - name: Build runnable container
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: matchpoint:ci
          cache-from: type=gha,scope=matchpoint-amd64
          cache-to: type=gha,scope=matchpoint-amd64,mode=max
          build-args: |
            VCS_REF=${{ github.sha }}
      - name: Verify Compose, non-root, read-only and persistent data
        env:
          SMOKE_IMAGE: matchpoint:ci
        run: bash scripts/container-smoke.sh
      - name: Validate optional Compose examples
        env:
          MATCHPOINT_DOMAIN: esports.example.com
        run: |
          docker compose -f compose.yml -f compose.build.yml config --quiet
          docker compose -f compose.yml -f compose.https.yml config --quiet
      - name: Save tested image for download
        run: docker save matchpoint:ci | gzip > matchpoint-docker-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: matchpoint-docker-amd64
          path: matchpoint-docker-amd64.tar.gz
          retention-days: 7
